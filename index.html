<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Both themes are shipped; the browser chrome follows whichever one the OS asks for
         until the user picks a theme in the settings. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2efe9" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="dotfront — минималистичный варгейм точек: линия фронта, снабжение, окружения. Одиночная игра против многослойного ИИ."
    />
    <!-- Inlined so the page makes no network request for it: two dots either side of a
         front line, which is the whole game. Without it the console carries a 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e1116'/%3E%3Cpath d='M16 3v26' stroke='%23e6e9ee' stroke-opacity='.45' stroke-width='2'/%3E%3Ccircle cx='9' cy='16' r='5' fill='%234a90d9'/%3E%3Ccircle cx='23' cy='16' r='5' fill='%23d94a4a'/%3E%3C/svg%3E"
    />
    <title>dotfront</title>
  </head>
  <body>
    <div id="app">
      <!-- The playfield. `input.ts` owns every pointer, wheel and contextmenu event
           on this element; the stylesheet only has to stop the browser from treating
           a drag as a text selection or a scroll gesture. -->
      <canvas id="game"></canvas>
      <canvas id="minimap"></canvas>
      <div id="hud"></div>
      <div id="overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
